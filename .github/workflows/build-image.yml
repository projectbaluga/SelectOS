name: Build SelectOS image

on:
  workflow_dispatch:
    inputs:
      binaries_release:
        description: "Release tag containing boot-binaries.tar.gz (use latest for the latest release)"
        required: false
        type: string
        default: latest

permissions:
  contents: read

jobs:
  build:
    name: Build bootable image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y parted dosfstools util-linux

      - name: Download boot binaries from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINARIES_RELEASE: ${{ inputs.binaries_release }}
        shell: bash
        run: |
          set +e
          if [[ "$BINARIES_RELEASE" == "latest" || -z "$BINARIES_RELEASE" ]]; then
            gh release download --repo "$GITHUB_REPOSITORY" \
              --pattern boot-binaries.tar.gz --dir .
          else
            gh release download "$BINARIES_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --pattern boot-binaries.tar.gz --dir .
          fi
          download_status=$?

          if (( download_status == 0 )) && [[ -f boot-binaries.tar.gz ]]; then
            tar -xzf boot-binaries.tar.gz -C . || echo "::warning::Could not extract boot-binaries.tar.gz; required-file validation will report missing files."
          else
            echo "::warning::Could not download boot-binaries.tar.gz from release '$BINARIES_RELEASE'; required-file validation will report missing files."
          fi
          exit 0

      - name: Verify required binary components
        shell: bash
        run: |
          required=(
            "boot/vmlinuz"
            "boot/select.img"
            "EFI/BOOT/BOOTX64.EFI"
            "EFI/BOOT/grubx64.efi"
            "EFI/BOOT/mmx64.efi"
          )
          missing=()
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              missing+=("$file")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Required boot binaries are missing. Commit or otherwise provide these files before running the image build:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Build SelectOS image
        run: sudo bash scripts/build-image.sh

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelectOS-image
          path: dist/SelectOS.img
          if-no-files-found: error
          retention-days: 14
