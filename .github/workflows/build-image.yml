name: Build legacy-compatible SelectOS image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build legacy Gate runtime image (login remains)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y parted dosfstools util-linux gzip

      - name: Extract legacy boot files
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE="gate-test.img.gz"
          [[ -s "$SOURCE" ]] || { echo "::error::Missing repository source image: $SOURCE"; exit 1; }
          gzip -t "$SOURCE"
          WORK="$(mktemp -d)"
          LOOP=""
          cleanup() {
            if [[ -n "$LOOP" ]]; then
              sudo umount "$WORK/source" 2>/dev/null || true
              sudo losetup -d "$LOOP" 2>/dev/null || true
            fi
            rm -rf "$WORK"
          }
          trap cleanup EXIT
          mkdir -p "$WORK/source"
          gzip -dc "$SOURCE" > "$WORK/source.img"
          LOOP="$(sudo losetup --find --show --partscan "$WORK/source.img")"
          PART="${LOOP}p1"
          for attempt in {1..10}; do
            [[ -b "$PART" ]] && break
            sleep 1
          done
          [[ -b "$PART" ]] || { echo "::error::Could not find source image partition $PART"; exit 1; }
          sudo mount -o ro "$PART" "$WORK/source"
          mkdir -p boot EFI/BOOT
          for file in BOOT/VMLINUZ BOOT/GATE.IMG EFI/BOOT/BOOTX64.EFI EFI/BOOT/GRUBX64.EFI EFI/BOOT/MMX64.EFI; do
            sudo test -s "$WORK/source/$file"
          done
          sudo cp "$WORK/source/BOOT/VMLINUZ" boot/vmlinuz
          sudo cp "$WORK/source/BOOT/GATE.IMG" boot/select.img
          sudo cp "$WORK/source/EFI/BOOT/BOOTX64.EFI" EFI/BOOT/BOOTX64.EFI
          sudo cp "$WORK/source/EFI/BOOT/GRUBX64.EFI" EFI/BOOT/grubx64.efi
          sudo cp "$WORK/source/EFI/BOOT/MMX64.EFI" EFI/BOOT/mmx64.efi
          sudo chown -R "$USER:$USER" boot EFI
          for file in boot/vmlinuz boot/select.img EFI/BOOT/BOOTX64.EFI EFI/BOOT/grubx64.efi EFI/BOOT/mmx64.efi; do
            [[ -s "$file" ]] || { echo "::error::Extraction failed: $file"; exit 1; }
          done

      - name: Build explicitly marked legacy image
        env:
          SELECTOS_ALLOW_LEGACY_GATE_RUNTIME: "1"
        run: sudo --preserve-env=SELECTOS_ALLOW_LEGACY_GATE_RUNTIME bash scripts/build-image.sh

      - name: Verify image and legacy warning manifest
        run: |
          test -s dist/SelectOS.img
          grep -q '^LOGIN_FREE=false$' dist/SELECTOS-BUILD-INFO.txt
          grep -q '^RUNTIME=legacy-gate-gbox$' dist/SELECTOS-BUILD-INFO.txt
          file dist/SelectOS.img

      - name: Upload legacy image artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelectOS-legacy-Gate-runtime
          path: |
            dist/SelectOS.img
            dist/SELECTOS-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
