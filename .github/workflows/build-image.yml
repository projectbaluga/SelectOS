name: Build SelectOS image

on:
  workflow_dispatch:
    inputs:
      binaries_release:
        description: "Release tag containing boot-binaries.tar.gz (latest or an exact tag)"
        required: false
        type: string
        default: latest

permissions:
  contents: read

jobs:
  build:
    name: Build bootable image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y parted dosfstools util-linux

      - name: Download and validate boot binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINARIES_RELEASE: ${{ inputs.binaries_release }}
        shell: bash
        run: |
          set -Eeuo pipefail

          args=(--repo "$GITHUB_REPOSITORY" --pattern boot-binaries.tar.gz --dir .)
          if [[ "$BINARIES_RELEASE" == "latest" || -z "$BINARIES_RELEASE" ]]; then
            gh release download "${args[@]}"
          else
            gh release download "$BINARIES_RELEASE" "${args[@]}"
          fi

          archive="boot-binaries.tar.gz"
          [[ -s "$archive" ]] || { echo "::error::Release asset is missing or empty: $archive"; exit 1; }
          tar -tzf "$archive" >/dev/null || { echo "::error::Boot-binaries archive is not a valid gzip tar file."; exit 1; }

          expected=(
            "boot/vmlinuz"
            "boot/select.img"
            "EFI/BOOT/BOOTX64.EFI"
            "EFI/BOOT/grubx64.efi"
            "EFI/BOOT/mmx64.efi"
          )
          for file in "${expected[@]}"; do
            if ! tar -tzf "$archive" | grep -Fxq "$file"; then
              echo "::error::Archive does not contain required path: $file"
              exit 1
            fi
          done

          tar -xzf "$archive" -C .
          for file in "${expected[@]}"; do
            [[ -s "$file" ]] || { echo "::error::Extracted file is missing or empty: $file"; exit 1; }
          done

      - name: Build SelectOS image
        run: sudo bash scripts/build-image.sh

      - name: Verify image output
        run: |
          test -s dist/SelectOS.img
          file dist/SelectOS.img

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelectOS-image
          path: dist/SelectOS.img
          if-no-files-found: error
          retention-days: 14
