name: Gate runtime (vet + test)

on:
  pull_request:
    paths:
      - "src/gate-runtime/**"
      - ".github/workflows/gate-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Check build script syntax
        run: bash -n src/gate-runtime/tools/build-image.sh
      - name: Vet and test
        working-directory: src/gate-runtime
        run: |
          go vet ./gate
          go test ./gate
