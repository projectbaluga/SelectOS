name: Test SelectOS auth server and client

on:
  push:
    paths:
      - "auth/server/**"
      - "auth/client/**"
      - "auth/gate/**"
      - ".github/workflows/auth-server.yml"
  pull_request:
    paths:
      - "auth/server/**"
      - "auth/client/**"
      - "auth/gate/**"
      - ".github/workflows/auth-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            auth/server/go.sum
            auth/client/go.sum
      - name: Resolve and verify dependencies
        working-directory: auth/server
        run: go mod tidy
      - name: Build server
        working-directory: auth/server
        run: |
          go vet ./...
          go test ./...
          go build -o /tmp/selectos-auth .
      - name: Build server Docker image
        run: docker build -t selectos-auth:test auth/server
      - name: Build client
        working-directory: auth/client
        run: |
          go mod tidy
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/selectos-auth-client .
      - name: Validate Gate hook shell syntax
        run: sh -n auth/gate/selectos-gate-auth.sh
