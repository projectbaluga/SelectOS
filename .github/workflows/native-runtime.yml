name: Native SelectOS runtime foundation

on:
  pull_request:
    paths:
      - "src/native-initramfs/**"
      - "scripts/build-native-initramfs.sh"
      - "tests/test-native-init.sh"
      - "docs/NATIVE-RUNTIME-STATUS.md"
      - ".github/workflows/native-runtime.yml"
  push:
    branches: [main]
    paths:
      - "src/native-initramfs/**"
      - "scripts/build-native-initramfs.sh"
      - "tests/test-native-init.sh"
      - ".github/workflows/native-runtime.yml"

permissions:
  contents: read

jobs:
  build-native-initramfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static cpio gzip coreutils file
      - name: Check shell syntax and boot-path isolation
        run: bash tests/test-native-init.sh
      - name: Build experimental initramfs
        run: bash scripts/build-native-initramfs.sh
      - name: Verify artifact and checksums
        run: |
          test -s dist/native/vmlinuz
          test -s dist/native/select-native.img
          grep -q '^PRODUCTION_READY=false$' dist/native/BUILD-INFO.txt
          (cd dist/native && sha256sum -c SHA256SUMS)
      - name: Upload experimental artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelectOS-native-runtime-bringup-experimental
          path: dist/native/
          if-no-files-found: error
          retention-days: 14
